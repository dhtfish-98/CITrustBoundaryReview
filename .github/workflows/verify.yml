name: Verify local trust-boundary package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r runtime.lock
          python -m pip install build==1.6.1 setuptools==84.0.0 ruff==0.16.10
      - run: |
          ruff check src tests
          ruff format --check src tests
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m build --no-isolation
      - run: |
          python -m venv .consumer
          .consumer/bin/python -m pip install --require-hashes --only-binary=:all: -r runtime.lock
          .consumer/bin/python -m pip install --no-deps dist/*.whl
          .consumer/bin/python -m unittest discover -s tests -v
          .consumer/bin/ci-trust-boundary-review examples/data-only.yml
