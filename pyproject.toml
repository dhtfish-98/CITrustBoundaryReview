[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-trust-boundary-review"
version = "0.1.0"
description = "Bounded offline static review of workflow input and execution trust boundaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]
license = "MIT"
license-files = ["LICENSE", "third_party/PyYAML/LICENSE"]
authors = [{name = "bitfish886"}]

[project.scripts]
ci-trust-boundary-review = "ci_trust_boundary_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/ci-trust-boundary-review" = ["README.md", "ORIGIN.md", "DEFENSIVE_SCOPE.md", "NOTICE", "VALIDATION.md", "SOURCE_REVIEW.json", "runtime.lock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
